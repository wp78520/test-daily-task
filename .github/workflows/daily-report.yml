name: Daily Report

on:
  schedule:
    - cron: '0 0 * * *'   # UTC 00:00 = 北京时间 08:00
  workflow_dispatch:

jobs:
  run-task:
    runs-on: ubuntu-latest
    env:
      STOCKS: "300059"
      NEWS_PER_STOCK: "5"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run daily task
        run: |
          python scripts/daily_task.py

      - name: Load report into env
        run: |
          echo "REPORT<<EOF" >> $GITHUB_ENV
          cat daily_report.txt >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Send email
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.qq.com
          server_port: 465
          secure: true
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: Daily Stock News Report
          to: ${{ secrets.EMAIL_TO }}
          from: ${{ secrets.EMAIL_USERNAME }}
          body: |
            Daily stock news report:

            ${{ env.REPORT }}
